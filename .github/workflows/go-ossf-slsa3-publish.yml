name: SLSA Go releaser

# Manual test run only. Releases get their SLSA L3 provenance from the
# slsa-build job in release.yml, behind the security gate. (A `release: created`
# trigger never fired: release.yml creates releases with GITHUB_TOKEN, and
# events caused by GITHUB_TOKEN don't start other workflows.)
on:
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    permissions:
      id-token: write   # to sign provenance
      contents: write   # required by the called builder's declared permissions
      actions: read     # to read the workflow path for provenance
    # Must be a vX.Y.Z tag, not a commit SHA: the builder verifies its own ref
    # and fails with "Invalid ref ... Expected ref of the form refs/tags/vX.Y.Z"
    # when SHA-pinned. This is the documented exception to SHA pinning.
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version-file: go.mod
      upload-assets: false
